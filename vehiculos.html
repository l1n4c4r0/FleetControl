<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - FleetControl</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="vehiculos-page">

    <!-- HEADER -->
    <header class="vehiculos-header">

        <div class="menu-btn">☰</div>

        <div class="logo-box">
            <h1>FleetControl</h1>
        </div>

    </header>

    <!-- TOP -->
    <section class="vehiculos-top">

        <div class="title-box">
            <h2>Vehículos</h2>
        </div>

        <div class="top-right">

            <!-- SEARCH -->
            <div class="search-small">

                <span>🔍</span>

                <input type="text" placeholder="Buscar ...">

            </div>

            <!-- PROFILE -->
            <div class="profile-circle">

                <div>👤</div>

                <span>LM</span>

            </div>

        </div>

    </section>

    <!-- CONTENT -->
    <section class="vehiculos-content-real">

        <!-- TABLE -->
        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Placa</th>
                        <th>Modelo</th>
                        <th>Estado</th>
                        <th>Kilometraje</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                </tbody>

            </table>

        </div>

        <!-- BUTTONS -->
        <div class="vehiculos-buttons">

            <button>Agregar vehículo</button>

            <button>Editar</button>

            <button>Eliminar</button>

        </div>

    </section>

</div>

</body>
</html>
